theme: dark

server:
  address: tcp://0.0.0.0:9091/
  endpoints:
    authz:
      # Naming any endpoint replaces the defaults, so forward-auth is restated.
      forward-auth:
        implementation: ForwardAuth
      # Session cookie only. For apps whose own requests carry an Authorization
      # header (the RustFS console signs with AWS SigV4): the default endpoint
      # reads that header as a failed Basic login and the browser prompts.
      forward-auth-cookie:
        implementation: ForwardAuth
        authn_strategies:
          - name: CookieSession

log:
  level: info

totp:
  issuer: '{{ env "BASE_DOMAIN" }}'

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 5m
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    timeout: 5s
    start_tls: false
    base_dn: '{{ env "LLDAP_BASE_DN" }}'
    additional_users_dn: ou=people
    users_filter: '(&({username_attribute}={input})(objectClass=person))'
    additional_groups_dn: ou=groups
    groups_filter: '(member={dn})'
    user: 'uid=admin,ou=people,{{ env "LLDAP_BASE_DN" }}'
    # AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD set in compose env

access_control:
  default_policy: deny
  rules:
    - domain: '*.{{ env "BASE_DOMAIN" }}'
      policy: one_factor

session:
  name: authelia_session
  expiration: 1M
  inactivity: 0
  remember_me: 1y
  cookies:
    - domain: '{{ env "BASE_DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "BASE_DOMAIN" }}'
      default_redirection_url: 'https://dashy.{{ env "BASE_DOMAIN" }}'

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notifications.txt

identity_providers:
  oidc:
    # hmac_secret comes from AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET env var
    jwks:
      - algorithm: 'RS256'
        use: 'sig'
        key: |
          {{- secret "/data/oidc-private.pem" | nindent 10 }}
    cors:
      endpoints:
        - 'authorization'
        - 'token'
        - 'revocation'
        - 'introspection'
        - 'userinfo'
      allowed_origins_from_client_redirect_uris: true
    # refresh_token default is 90m; bump it so desktop/mobile clients survive
    # long sleeps without forcing an interactive re-login on wake.
    lifespans:
      refresh_token: '90d'
    clients:
      # Dashy dashboard. Public client (PKCE): Dashy's OIDC config takes no secret.
      # The groups scope is what lets Dashy hide admin-only tiles.
      - client_id: dashy
        client_name: Dashy
        public: true
        authorization_policy: one_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - 'https://dashy.{{ env "BASE_DOMAIN" }}'
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none

      - client_id: immich
        client_name: Immich
        client_secret: '{{ env "IMMICH_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://pics.{{ env "BASE_DOMAIN" }}/auth/login'
          - 'https://pics.{{ env "BASE_DOMAIN" }}/user-settings'
          - 'app.immich:///oauth-callback'
        scopes:
          - openid
          - profile
          - email
          - groups
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      - client_id: huginn
        client_name: Huginn
        client_secret: '{{ env "HUGINN_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://huginn.{{ env "BASE_DOMAIN" }}/auth/oidc/callback'
        scopes:
          - openid
          - profile
          - email
          - groups
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      # RustFS console SSO. RustFS requires PKCE S256 and maps the groups claim
      # onto a RustFS policy of the same name.
      - client_id: rustfs
        client_name: RustFS
        client_secret: '{{ env "RUSTFS_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - 'https://s3-console.{{ env "BASE_DOMAIN" }}/rustfs/admin/v3/oidc/callback/default'
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
