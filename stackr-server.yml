version: 1

# Forwards to machines outside stackr. Ported from the old Traefik
# (serverconfig/stacks/traefik/dynamic). This block is the whole list:
# a route not named here shows as a removal in the plan.
#
# nas and s3-console sat behind Authelia on the old Traefik. A stackr route
# has no login step yet, so for now only their own login pages protect them.
routes:
  # Proxmox web UI, self-signed certificate on the host
  - host: vms.vulpe.dev
    mode: https
    target: 192.168.1.99:8006
    insecure: true

  # RustFS S3 API on TrueNAS. No login in front: clients sign requests.
  - host: s3.vulpe.dev
    mode: http
    target: 192.168.1.102:30292

  # Pi-hole admin, until Pi-hole moves into stackr
  - host: pihole.vulpe.dev
    mode: http
    target: 192.168.1.101:80

  # TrueNAS web UI. NO login in front (was Authelia): only TrueNAS's own.
  - host: nas.vulpe.dev
    mode: http
    target: 192.168.1.102:80

  # RustFS console on TrueNAS. NO login in front (was Authelia): only its own.
  - host: s3-console.vulpe.dev
    mode: http
    target: 192.168.1.102:30293
