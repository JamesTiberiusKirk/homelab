version: 1
org: homelab

# Where the org's envs run unless a stack says otherwise.
pin: media                     # the placement on home-ct

# The old addresses stay: apps keep their vulpe.dev names.
domains:
  - host: vulpe.dev

# NAS exports the tiles mount. TrueNAS allows the home node (192.168.1.104).
shares:
  media:
    kind: nfs
    source: 192.168.1.102:/mnt/tank/media
  downloads:
    kind: nfs
    source: 192.168.1.102:/mnt/tank/downloads

# One file per stack, all in this repo.
stacks:
  infra:
    path: stacks/infra/stackr-compose.yml
  media:
    path: stacks/media/stackr-compose.yml
