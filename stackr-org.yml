version: 1
org: homelab

# Where the org's envs run unless a stack says otherwise.
pin: media                     # the placement on home-ct

# The old addresses stay: apps keep their vulpe.dev names.
domains:
  - host: vulpe.dev

# NAS exports the tiles mount. TrueNAS allows the home node (192.168.1.104).
shares:
  media:
    kind: nfs
    source: 192.168.1.102:/mnt/tank/media
    options: nfsvers=4.2   # NFS 3 needs helper services on the node that it does not run
  downloads:
    kind: nfs
    source: 192.168.1.102:/mnt/tank/downloads
    options: nfsvers=4.2   # NFS 3 needs helper services on the node that it does not run
  # App data: one dataset per app under tank/apps on TrueNAS.
  photos:
    kind: nfs
    source: 192.168.1.102:/mnt/tank/apps/immich
    options: nfsvers=4.2

# One file per stack. In this repo unless the entry names another.
stacks:
  infra:
    path: stacks/infra/stackr-compose.yml
  media:
    path: stacks/media/stackr-compose.yml
  auth:
    path: stacks/auth/stackr-compose.yml
  dashy:
    path: stacks/dashy/stackr-compose.yml
  immich:
    path: stacks/immich/stackr-compose.yml
  # Huginn keeps its stack file in its own repo, next to the code it builds.
  huginn:
    repo: FyrmForge/huginn
    branch: master
    path: stackr-compose.yml
